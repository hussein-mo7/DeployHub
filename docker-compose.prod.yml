# Postgres + Redis on the same VPS as the API (localhost only — not exposed to the internet).
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  postgres:
    # Replace base compose ports (merge would append and double-bind the host port).
    ports: !override
      - "127.0.0.1:5432:5432"

  redis:
    ports: !override
      - "127.0.0.1:6379:6379"
